[package]
name = "rabbit-kernel"
description = "Rabbit x86_64 kernel binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rabbit-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rabbit-arch = { path = "../rabbit-arch" }
rabbit-bootinfo = { path = "../rabbit-bootinfo" }
rabbit-drivers = { path = "../rabbit-drivers" }
rabbit-elf = { path = "../rabbit-elf" }
rabbit-initramfs = { path = "../rabbit-initramfs" }
rabbit-mm = { path = "../rabbit-mm" }
rabbit-net = { path = "../rabbit-net" }
rabbit-sched = { path = "../rabbit-sched" }

# The protocols are a dependency of the kernel before the code that carries a
# datagram uses them, which is the next step of the milestone. Until then the
# manifest lint would warn that `rabbit-net` is never named.
[lints.cargo]
unused_dependencies = "allow"
