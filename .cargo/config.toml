# Cargo configuration for the Rabbit workspace.
#
# The bare-metal target and the `-Z build-std` flags are deliberately NOT set
# here: they are passed on the command line by the Makefile, so that plain
# `cargo test` and `cargo clippy` keep working on the host inside this
# workspace. The kernel-only crates are excluded from the host runs.

[unstable]
json-target-spec = true

[target.x86_64-rabbit]
rustflags = ["-C", "link-arg=-Tlinker.ld"]

[alias]
kbuild = "build --release --target x86_64-rabbit.json -Z build-std=core,compiler_builtins -Z build-std-features=compiler-builtins-mem"
