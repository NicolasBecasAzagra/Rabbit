[workspace]
resolver = "2"
members = [
    "rabbit-arch",
    "rabbit-bootinfo",
    "rabbit-drivers",
    "rabbit-elf",
    "rabbit-initramfs",
    "rabbit-kernel",
    "rabbit-mm",
    "rabbit-policy",
    "rabbit-sched",
    "rabbit-uefi",
]
# The UEFI loader targets the firmware, not the kernel: a plain `cargo build`
# with the kernel target must not try to link it with the kernel script.
default-members = [
    "rabbit-arch",
    "rabbit-bootinfo",
    "rabbit-drivers",
    "rabbit-elf",
    "rabbit-initramfs",
    "rabbit-kernel",
    "rabbit-mm",
    "rabbit-policy",
    "rabbit-sched",
]
# Crates that carry their own workspace must be named here, or the paths that
# point into them make cargo see two workspace roots in the same tree.
exclude = ["rabbit-net", "rabbit-http"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
