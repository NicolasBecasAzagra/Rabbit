<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /*__CSS__*/

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        padding: 80px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-body);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .brand svg {
        width: 48px;
        height: 96px;
        color: var(--ink);
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: var(--ink);
      }

      .rule {
        width: 100%;
        height: 2px;
        background: var(--accent);
        margin-block: 40px;
      }

      .headline {
        font-family: var(--font-display);
        font-size: 96px;
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--ink);
      }

      .headline-accent {
        color: var(--accent);
      }

      .compare {
        margin-block-start: 24px;
        font-family: var(--font-body);
        font-size: 32px;
        color: var(--ink-secondary);
      }

      .compare-strong {
        color: var(--ink);
      }

      .context {
        margin-block-start: 16px;
        font-family: var(--font-mono);
        font-size: 24px;
        color: var(--ink-secondary);
      }

      .footer {
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <svg viewBox="9 2 14 28" fill="currentColor" aria-hidden="true">
          <path d="M9 4.5a2.5 2.5 0 0 1 5 0v23a2.5 2.5 0 0 1-5 0zM18 4.5a2.5 2.5 0 0 1 5 0v23a2.5 2.5 0 0 1-5 0z"/>
        </svg>
        <span class="brand-name">Rabbit</span>
      </div>

      <div class="rule"></div>

      <p class="headline">
        <span class="headline-accent">376 ns</span> system call
      </p>
      <p class="compare">
        <span class="compare-strong">vs 29.3 µs</span> on mainline Linux 7.3.0,
        <span class="compare-strong">1.04 µs</span> with mitigations off
      </p>
      <p class="context">QEMU TCG, an emulator</p>
    </div>

    <p class="footer">github.com/NicolasBecasAzagra/Rabbit</p>
  </body>
</html>
