<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img">
  <title>Rabbit — an operating system for local AI agents</title>
  <desc>The Rabbit mark, a black rounded square with two tall ears cut out of it as negative space, next to the word Rabbit and the tagline: an operating system for local AI agents, written in Rust from the kernel up. Black and white only.</desc>
  <style>
    svg { --ink:#000; --paper:#fff; --surface:#f2f2f2; --graphite:#404040; --muted:#6b6b6b; --hair:rgba(0,0,0,0.14); }
    @media (prefers-color-scheme: dark) { svg { --ink:#fff; --paper:#000; --surface:#171717; --graphite:#e5e5e5; --muted:#8f8f8f; --hair:rgba(255,255,255,0.16); } }
    .bg { fill: var(--paper); }
    .border { fill: none; stroke: var(--hair); stroke-width: 1; }
    .sans { font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .mark { fill: var(--ink); fill-rule: evenodd; }
    .word { fill: var(--ink); font-size: 140px; font-weight: 800; letter-spacing: -0.06em; }
    .tagline { fill: var(--graphite); font-size: 25px; font-weight: 400; }
  </style>
  <rect class="bg" width="1280" height="360" rx="14"/>
  <rect class="border" width="1278" height="358" x="1" y="1" rx="13"/>
  <g transform="translate(80,92) scale(4)">
    <path class="mark" d="M8 0h28a8 8 0 0 1 8 8v28a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8z M15 10.5a2.5 2.5 0 0 1 5 0v23a2.5 2.5 0 0 1-5 0zM24 10.5a2.5 2.5 0 0 1 5 0v23a2.5 2.5 0 0 1-5 0z"/>
  </g>
  <text class="sans word" x="296" y="203">Rabbit</text>
  <text class="sans tagline" x="302" y="250">An operating system for local AI agents, written in Rust from the kernel up.</text>
</svg>
