<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img">
  <title>Rabbit benchmark highlights</title>
  <desc>Selected measurements from the benchmark table: 376 ns for a system call, 12.9 s to boot to the first result, 0.45 tokens per second, 857 MB resident memory with the model, 821 seconds for an agent loop, and 6.83 ms per MiB to map and touch memory. All measured under QEMU TCG, an emulator, on one host.</desc>
  <style>
    svg { --ink:#000; --paper:#fff; --surface:#f7f2ed; --graphite:#4a3b32; --muted:#75655a; --hair:rgba(111,69,40,0.18); }
    @media (prefers-color-scheme: dark) { svg { --ink:#fff; --paper:#000; --surface:#1c1511; --graphite:#ede4dc; --muted:#a8968a; --hair:rgba(255,255,255,0.16); } }
    .bg { fill: var(--paper); }
    .border { fill: none; stroke: var(--hair); stroke-width: 1; }
    .sans { font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .number { fill: var(--ink); font-size: 46px; font-weight: 700; letter-spacing: -0.03em; }
    .label { fill: var(--graphite); font-size: 20px; font-weight: 400; }
    .rule { stroke: var(--hair); stroke-width: 1; }
    .head { stroke: var(--ink); stroke-width: 2; }
    .square { fill: var(--ink); }
    .context { fill: var(--ink); font-size: 18px; font-weight: 500; letter-spacing: 0.02em; }
  </style>
  <rect class="bg" width="1280" height="360" rx="14"/>
  <rect class="border" width="1278" height="358" x="1" y="1" rx="13"/>
  <line class="head" x1="48" y1="36" x2="1232" y2="36"/>
  <line class="rule" x1="48" y1="160" x2="1232" y2="160"/>
  <line class="rule" x1="48" y1="284" x2="1232" y2="284"/>
  <line class="rule" x1="432" y1="52" x2="432" y2="268"/>
  <line class="rule" x1="840" y1="52" x2="840" y2="268"/>

  <text class="mono number" x="48" y="100">376 ns</text>
  <text class="sans label" x="48" y="134">system call</text>
  <text class="mono number" x="456" y="100">12.9 s</text>
  <text class="sans label" x="456" y="134">boot to the first result</text>
  <text class="mono number" x="864" y="100">0.45</text>
  <text class="sans label" x="864" y="134">tokens per second</text>

  <text class="mono number" x="48" y="224">857 MB</text>
  <text class="sans label" x="48" y="258">resident memory with the model</text>
  <text class="mono number" x="456" y="224">821 s</text>
  <text class="sans label" x="456" y="258">seconds of an agent loop</text>
  <text class="mono number" x="864" y="224">6.83 ms/MiB</text>
  <text class="sans label" x="864" y="258">map and touch memory</text>

  <rect class="square" x="48" y="308" width="16" height="16"/>
  <text class="mono context" x="78" y="322">QEMU TCG, an emulator, one host</text>
</svg>
