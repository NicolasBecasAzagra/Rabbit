<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img">
  <title>The three layers of Rabbit</title>
  <desc>Three stacked layers — the agent, the runtime, and the kernel — over the Linux ABI. A request token travels down from the agent through the runtime into the kernel and a result token travels back up.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #f7f5f0; }
    .border { fill: none; stroke: rgba(26,26,26,0.12); stroke-width: 1; }
    .panel-agent { fill: #ac3c0d; }
    .panel-runtime { fill: #f0ede6; }
    .panel-kernel { fill: #e8e4db; }
    .panel-base { fill: #e8e4db; }
    .ink { fill: #1a1a1a; }
    .secondary { fill: #6b6560; }
    .inverse { fill: #f7f5f0; }
    .inverse-secondary { fill: rgba(247,245,240,0.82); }
    .connector { fill: none; stroke: rgba(26,26,26,0.18); stroke-width: 2; stroke-dasharray: 6 6; }
    .tick { fill: none; stroke: rgba(26,26,26,0.18); stroke-width: 2; }
    .node { fill: #ac3c0d; }
    .glow { fill: #ac3c0d; opacity: 0.22; }
    .token-req { fill: #ac3c0d; }
    .token-res { fill: #1a1a1a; }
    .trail-req { fill: #ac3c0d; }
    .trail-res { fill: #1a1a1a; }
    .label { font-size: 14px; font-weight: 400; }
    .layer-name { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .layer-name-sm { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .layer-body { font-size: 16px; font-weight: 400; }
    .base-label { font-size: 18px; font-weight: 700; }
    @keyframes drop {
      0% { transform: translateY(0); opacity: 1; }
      32% { transform: translateY(201px); opacity: 1; }
      40% { transform: translateY(201px); opacity: 0; }
      41% { transform: translateY(0); opacity: 0; }
      100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes rise {
      0%,44% { transform: translateY(201px); opacity: 0; }
      50% { transform: translateY(201px); opacity: 1; }
      82% { transform: translateY(0); opacity: 1; }
      90% { transform: translateY(0); opacity: 0; }
      100% { transform: translateY(201px); opacity: 0; }
    }
    .mover { animation-duration: 7s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    .down { animation-name: drop; }
    .up { animation-name: rise; }
    .t1 { animation-delay: 0s; }
    .t2 { animation-delay: -0.12s; }
    .t3 { animation-delay: -0.24s; }
    .t4 { animation-delay: -0.36s; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d0d0d; }
      .border { stroke: rgba(232,230,225,0.10); }
      .panel-agent { fill: #e07b4d; }
      .panel-runtime { fill: #141414; }
      .panel-kernel { fill: #1a1a1a; }
      .panel-base { fill: #1a1a1a; }
      .ink { fill: #e8e6e1; }
      .secondary { fill: #a8a29e; }
      .inverse { fill: #0d0d0d; }
      .inverse-secondary { fill: rgba(13,13,13,0.78); }
      .connector { stroke: rgba(232,230,225,0.14); }
      .tick { stroke: rgba(232,230,225,0.14); }
      .node { fill: #e07b4d; }
      .glow { fill: #e07b4d; }
      .token-req { fill: #e07b4d; }
      .token-res { fill: #e8e6e1; }
      .trail-req { fill: #e07b4d; }
      .trail-res { fill: #e8e6e1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .traffic { opacity: 0; }
    }
  </style>
  <rect class="bg" width="1280" height="360" rx="28"/>
  <rect class="border" width="1278" height="358" x="1" y="1" rx="27"/>

  <!-- layers -->
  <rect class="panel-agent" x="80" y="36" width="860" height="78" rx="14"/>
  <text class="inverse layer-name" x="110" y="68">the agent</text>
  <text class="inverse-secondary layer-body" x="110" y="94">model, tool, result over seven tools</text>

  <rect class="panel-runtime" x="80" y="122" width="860" height="66" rx="14"/>
  <text class="ink layer-name-sm" x="110" y="150">the runtime</text>
  <text class="secondary layer-body" x="110" y="176">weights, forward pass, bytes, a byte grammar</text>

  <rect class="panel-kernel" x="80" y="194" width="860" height="66" rx="14"/>
  <text class="ink layer-name-sm" x="110" y="222">the kernel</text>
  <text class="secondary layer-body" x="110" y="248">paging, scheduling, memory, processes</text>

  <!-- base -->
  <rect class="panel-base" x="80" y="276" width="860" height="48" rx="12"/>
  <text class="ink base-label" x="510" y="305" text-anchor="middle">Linux ABI, unmodified programs</text>

  <!-- pipe column -->
  <line class="connector" x1="1000" y1="75" x2="1000" y2="276"/>
  <line class="tick" x1="940" y1="75" x2="995" y2="75"/>
  <line class="tick" x1="940" y1="155" x2="995" y2="155"/>
  <line class="tick" x1="940" y1="227" x2="995" y2="227"/>
  <circle class="node" cx="1000" cy="75" r="5"/>
  <circle class="node" cx="1000" cy="155" r="4"/>
  <circle class="node" cx="1000" cy="227" r="4"/>

  <!-- labels -->
  <circle class="token-req" cx="1015" cy="75" r="5"/>
  <text class="label secondary" x="1030" y="80">request</text>
  <circle class="token-res" cx="1015" cy="276" r="5"/>
  <text class="label secondary" x="1030" y="281">result</text>

  <!-- traffic -->
  <g class="traffic">
    <!-- request down -->
    <circle class="glow mover down t4" cx="1000" cy="75" r="18"/>
    <circle class="trail-req mover down t3" cx="1000" cy="75" r="4" opacity="0.35"/>
    <circle class="trail-req mover down t2" cx="1000" cy="75" r="5" opacity="0.55"/>
    <circle class="trail-req mover down t1" cx="1000" cy="75" r="6" opacity="0.75"/>
    <circle class="token-req mover down t1" cx="1000" cy="75" r="8"/>
    <!-- result up -->
    <circle class="glow mover up t4" cx="1000" cy="276" r="18"/>
    <circle class="trail-res mover up t3" cx="1000" cy="276" r="4" opacity="0.35"/>
    <circle class="trail-res mover up t2" cx="1000" cy="276" r="5" opacity="0.55"/>
    <circle class="trail-res mover up t1" cx="1000" cy="276" r="6" opacity="0.75"/>
    <circle class="token-res mover up t1" cx="1000" cy="276" r="8"/>
  </g>
</svg>
