<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img">
  <title>The three layers of Rabbit</title>
  <desc>Three stacked layers: the agent (model, tool, result over seven tools), the runtime (weights, forward pass, bytes, a byte grammar) and the kernel (paging, scheduling, memory, threads), over the Linux ABI for unmodified programs. A request, drawn as a solid dot, travels down from the agent through the runtime into the kernel, and a result, drawn as a hollow dot, travels back up.</desc>
  <style>
    svg { --ink:#000; --paper:#fff; --surface:#f7f2ed; --graphite:#4a3b32; --muted:#75655a; --hair:rgba(111,69,40,0.18); }
    @media (prefers-color-scheme: dark) { svg { --ink:#fff; --paper:#000; --surface:#1c1511; --graphite:#ede4dc; --muted:#a8968a; --hair:rgba(255,255,255,0.16); } }
    .bg { fill: var(--paper); }
    .border { fill: none; stroke: var(--hair); stroke-width: 1; }
    .sans { font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .agent { fill: var(--ink); }
    .layer { fill: var(--surface); }
    .base { fill: none; stroke: var(--ink); stroke-width: 2; }
    .t-inv { fill: var(--paper); }
    .t-ink { fill: var(--ink); }
    .t-sec { fill: var(--graphite); }
    .name { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
    .body { font-size: 19px; font-weight: 400; }
    .basel { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
    .label { font-size: 18px; font-weight: 500; }
    .pipe { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    .tick { stroke: var(--ink); stroke-width: 2; fill: none; }
    .dot-solid { fill: var(--ink); }
    .dot-hollow { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
    @keyframes drop { 0% { transform: translateY(0); opacity: 1; } 36% { transform: translateY(240px); opacity: 1; } 44%,100% { transform: translateY(240px); opacity: 0; } }
    @keyframes rise { 0%,50% { transform: translateY(0); opacity: 0; } 54% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(-240px); opacity: 1; } 96%,100% { transform: translateY(-240px); opacity: 0; } }
    .mover { animation-duration: 7s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .down { animation-name: drop; }
    .up { animation-name: rise; }
    @media (prefers-reduced-motion: reduce) { .traffic { display: none; } }
  </style>
  <rect class="bg" width="1280" height="360" rx="14"/>
  <rect class="border" width="1278" height="358" x="1" y="1" rx="13"/>

  <rect class="agent" x="60" y="28" width="880" height="84" rx="10"/>
  <text class="sans t-inv name" x="90" y="62">the agent</text>
  <text class="sans t-inv body" x="90" y="92">model, tool, result over seven tools</text>

  <rect class="layer" x="60" y="120" width="880" height="72" rx="10"/>
  <text class="sans t-ink name" x="90" y="152">the runtime</text>
  <text class="sans t-sec body" x="90" y="178">weights, forward pass, bytes, a byte grammar</text>

  <rect class="layer" x="60" y="200" width="880" height="72" rx="10"/>
  <text class="sans t-ink name" x="90" y="232">the kernel</text>
  <text class="sans t-sec body" x="90" y="258">paging, scheduling, memory, threads</text>

  <rect class="base" x="61" y="283" width="878" height="48" rx="9"/>
  <text class="sans t-ink basel" x="500" y="314" text-anchor="middle">Linux ABI, unmodified programs</text>

  <line class="pipe" x1="1000" y1="70" x2="1000" y2="307"/>
  <line class="tick" x1="940" y1="70" x2="1000" y2="70"/>
  <line class="tick" x1="940" y1="156" x2="1000" y2="156"/>
  <line class="tick" x1="940" y1="236" x2="1000" y2="236"/>
  <line class="tick" x1="940" y1="307" x2="1000" y2="307"/>
  <circle class="node" cx="1000" cy="156" r="5"/>
  <circle class="node" cx="1000" cy="236" r="5"/>

  <circle class="dot-solid" cx="1000" cy="70" r="8"/>
  <text class="mono t-ink label" x="1022" y="76">request</text>
  <circle class="dot-hollow" cx="1000" cy="307" r="8"/>
  <text class="mono t-ink label" x="1022" y="313">result</text>

  <g class="traffic">
    <circle class="dot-solid mover down" cx="1000" cy="70" r="8"/>
    <circle class="dot-hollow mover up" cx="1000" cy="307" r="8"/>
  </g>
</svg>
